<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recordatorio de Cumpleaños</title>
    <!-- Favicon de Pastel Dinámico -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎂</text></svg>">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        @keyframes fadeInScale {
            0% { opacity: 0; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(236, 72, 153, 0.3); }
            50% { box-shadow: 0 0 35px rgba(236, 72, 153, 0.6); }
        }
        .animate-fade-in {
            animation: fadeInScale 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .animate-float {
            animation: floatSlow 4s ease-in-out infinite;
        }
        .animate-glow {
            animation: pulseGlow 3s ease-in-out infinite;
        }
    </style>
</head>
<body class="h-full bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 flex flex-col font-sans antialiased transition-colors duration-300">

    <header class="bg-white/80 dark:bg-slate-800/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-700 sticky top-0 z-30 shadow-sm transition-colors duration-300">
        <div class="max-w-5xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-pink-500 to-rose-400 flex items-center justify-center text-white shadow-md shadow-pink-500/20 animate-float">
                    <i class="fa-solid fa-cake-candles text-lg"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight text-slate-900 dark:text-white">CumpleApp</h1>
                    <p class="text-xs text-slate-500 dark:text-slate-400">Nunca olvides una fecha especial</p>
                </div>
            </div>
            <div class="flex items-center space-x-3 w-full sm:w-auto justify-end flex-wrap gap-y-2">
                <span id="syncStatus" class="text-xs text-slate-400 hidden sm:inline-block"><i class="fa-solid fa-circle text-[8px] text-emerald-500 mr-1 animate-pulse"></i>Auto-sync activo</span>
                <button onclick="toggleDarkMode()" class="w-10 h-10 rounded-xl bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600 flex items-center justify-center transition-all shadow-sm transform hover:scale-105 active:scale-95" title="Cambiar tema">
                    <i id="themeIcon" class="fa-solid fa-moon text-sm"></i>
                </button>
                <button onclick="openModal()" class="bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-600 hover:to-rose-600 text-white font-medium px-4 py-2.5 rounded-xl shadow-md shadow-pink-500/20 transition-all transform hover:scale-105 active:scale-95 flex items-center justify-center space-x-2 text-sm">
                    <i class="fa-solid fa-plus"></i>
                    <span>Nuevo Cumpleaños</span>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-5xl w-full mx-auto px-4 py-6 flex flex-col gap-6">
        
        <!-- Banner Superior Estricto para la Fecha Más Cercana (Múltiples si comparten fecha) -->
        <div id="topFeaturedBirthdayContainer" class="flex flex-col gap-4"></div>

        <!-- Banner de Alertas para cumpleaños de hoy -->
        <div id="todayAlertsContainer"></div>

        <!-- Cuadricula de Estadísticas -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200/80 dark:border-slate-700 shadow-sm flex items-center space-x-4 transition-all duration-300 hover:shadow-md transform hover:-translate-y-1">
                <div class="w-12 h-12 rounded-xl bg-pink-50 dark:bg-pink-900/30 text-pink-500 flex items-center justify-center text-xl">
                    <i class="fa-solid fa-gift"></i>
                </div>
                <div>
                    <p class="text-xs font-medium text-slate-400 uppercase tracking-wider">Este Mes</p>
                    <h3 id="statThisMonth" class="text-2xl font-bold text-slate-800 dark:text-white">0</h3>
                </div>
            </div>
            <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200/80 dark:border-slate-700 shadow-sm flex items-center space-x-4 transition-all duration-300 hover:shadow-md transform hover:-translate-y-1">
                <div class="w-12 h-12 rounded-xl bg-amber-50 dark:bg-amber-900/30 text-amber-500 flex items-center justify-center text-xl">
                    <i class="fa-solid fa-hourglass-half"></i>
                </div>
                <div>
                    <p class="text-xs font-medium text-slate-400 uppercase tracking-wider">Próximo</p>
                    <h3 id="statNext" class="text-lg font-bold text-slate-800 dark:text-white truncate max-w-[150px]">-</h3>
                </div>
            </div>
            <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200/80 dark:border-slate-700 shadow-sm flex items-center space-x-4 transition-all duration-300 hover:shadow-md transform hover:-translate-y-1">
                <div class="w-12 h-12 rounded-xl bg-indigo-50 dark:bg-indigo-900/30 text-indigo-500 flex items-center justify-center text-xl">
                    <i class="fa-solid fa-users"></i>

                <div>

                    <h3 id="statTotal" class="text-2xl font-bold text-slate-800 dark:text-white">0</h3>
                </div>
            </div>
        </div>

        <!-- Controles de Búsqueda y Filtro -->
        <div class="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200/80 dark:border-slate-700 shadow-sm flex flex-col sm:flex-row items-center justify-between gap-4 transition-colors duration-300">
            <div class="relative w-full sm:w-80">
                <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                    <i class="fa-solid fa-magnifying-glass text-sm"></i>
                </span>
                <input type="text" id="searchInput" oninput="filterBirthdays()" placeholder="Buscar por nombre..." class="w-full pl-10 pr-4 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-sm text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-pink-500/20 focus:border-pink-500 transition-all">
            </div>
            <div class="flex items-center space-x-2 w-full sm:w-auto overflow-x-auto pb-1 sm:pb-0">
                <button onclick="setFilter('all')" id="filter-all" class="filter-btn px-3.5 py-1.5 rounded-xl text-xs font-medium bg-pink-500 text-white transition-all whitespace-nowrap shadow-sm">Todos</button>
                <button onclick="setFilter('month')" id="filter-month" class="filter-btn px-3.5 py-1.5 rounded-xl text-xs font-medium bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600 transition-all whitespace-nowrap">Este Mes</button>
                <button onclick="setFilter('upcoming')" id="filter-upcoming" class="filter-btn px-3.5 py-1.5 rounded-xl text-xs font-medium bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600 transition-all whitespace-nowrap">Próximos 30 días</button>
                <button onclick="syncFromGoogleSheets(false)" id="syncDirectBtn" class="px-3.5 py-1.5 rounded-xl text-xs font-medium bg-emerald-50 dark:bg-emerald-950/40 text-emerald-600 dark:text-emerald-400 border border-emerald-200 dark:border-emerald-800/60 hover:bg-emerald-100 dark:hover:bg-emerald-900/40 transition-all whitespace-nowrap flex items-center space-x-1.5 shadow-sm transform hover:scale-105 active:scale-95">
                    <i class="fa-solid fa-rotate"></i>
                    <span>Actualizar desde Web</span>
                </button>
            </div>
        </div>

        <div class="flex-1">
            <div id="birthdayList" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Tarjetas dinámicas aquí -->
            </div>
            <div id="emptyState" class="hidden flex flex-col items-center justify-center py-16 text-center animate-fade-in">
                <div class="w-16 h-16 rounded-2xl bg-slate-100 dark:bg-slate-800 text-slate-400 flex items-center justify-center text-2xl mb-4">
                    <i class="fa-solid fa-cake-candles"></i>
                </div>
                <h3 class="text-base font-semibold text-slate-700 dark:text-slate-300">No hay cumpleaños encontrados</h3>
                <p class="text-sm text-slate-400 mt-1 max-w-sm">Agrega nuevos cumpleaños usando el botón superior o sincroniza desde tu hoja web.</p>
            </div>
        </div>
    </main>

    <!-- Modal para Agregar/Editar -->
    <div id="birthdayModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden opacity-0 transition-opacity duration-300">
        <div class="bg-white dark:bg-slate-800 rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-100 dark:border-slate-700 transform scale-95 transition-transform duration-300" id="modalContent">
            <div class="flex justify-between items-center mb-5">
                <h3 id="modalTitle" class="text-lg font-bold text-slate-900 dark:text-white">Nuevo Cumpleaños</h3>
                <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-700 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 flex items-center justify-center transition-colors">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <form id="birthdayForm" onsubmit="saveBirthday(event)" class="space-y-4">
                <input type="hidden" id="editIndex" value="">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-1.5">Nombre Completo</label>
                    <input type="text" id="bName" required placeholder="Ej. Sofía Martínez" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-sm text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-pink-500/20 focus:border-pink-500 transition-all">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-1.5">Fecha de Nacimiento</label>
                        <input type="date" id="bDate" required class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-sm text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-pink-500/20 focus:border-pink-500 transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-1.5">Categoría</label>
                        <select id="bCategory" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-sm text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-pink-500/20 focus:border-pink-500 transition-all">
                            <option value="Atencion al usuario">Atencion al usuario</option>
                            <option value="Minsal">Minsal</option>
                            <option value="Doctor/a">Doctor/a</option>
                            <option value="otro">otro</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-1.5">Foto (Link URL)</label>
                    <input type="url" id="bPhoto" placeholder="https://ejemplo.com/foto.jpg" class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-sm text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-pink-500/20 focus:border-pink-500 transition-all">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-1.5">Notas o Regalos (Opcional)</label>
                    <textarea id="bNotes" rows="2" placeholder="Ej. Le gusta el chocolate, talla M..." class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-sm text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-pink-500/20 focus:border-pink-500 transition-all"></textarea>
                </div>
                <div class="flex space-x-3 pt-2">
                    <button type="button" onclick="closeModal()" class="flex-1 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-600 dark:text-slate-300 font-medium py-2.5 rounded-xl text-sm transition-colors">Cancelar</button>
                    <button type="submit" class="flex-1 bg-pink-500 hover:bg-pink-600 text-white font-medium py-2.5 rounded-xl text-sm shadow-md shadow-pink-500/20 transition-all">Guardar</button>
                </div>
            </form>

    </div>

    <!-- Modal Personalizado para Mensajes -->
    <div id="customModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white dark:bg-slate-800 rounded-3xl max-w-sm w-full p-6 shadow-2xl text-center border border-slate-100 dark:border-slate-700 animate-fade-in">
            <div id="customModalIcon" class="w-12 h-12 rounded-2xl bg-pink-50 dark:bg-pink-900/30 text-pink-500 flex items-center justify-center text-xl mx-auto mb-3">
                <i class="fa-solid fa-bell"></i>
            </div>
            <h4 id="customModalTitle" class="text-base font-bold text-slate-900 dark:text-white mb-1">Aviso</h4>
            <p id="customModalText" class="text-sm text-slate-500 dark:text-slate-400 mb-5">Mensaje del sistema.</p>
            <button onclick="closeCustomModal()" class="w-full bg-slate-900 dark:bg-slate-700 hover:bg-slate-800 dark:hover:bg-slate-600 text-white font-medium py-2.5 rounded-xl text-sm transition-colors">Entendido</button>
        </div>
    </div>

    <script>
        let birthdays = JSON.parse(localStorage.getItem('birthday_app_data')) || [
            { name: 'Maria Mejia', date: '1995-02-05', category: 'Atencion al usuario', notes: 'Le encantan las flores rojas', photo: '' },
            { name: 'Krissia Rosa', date: '1990-02-19', category: 'Atencion al usuario', notes: 'Café de especialidad', photo: '' }
        ];

        let currentFilter = 'all';
        let googleSheetsUrl = localStorage.getItem('birthday_sheets_url') || 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRIS56Nu-Eeh2jb1eyYu_7uqOGl8Qb_LXh5c48gD8iJYZw4RlCEsKidBaZ1zorpbjlpoeLOegNPucQS/pub?gid=0&single=true&output=csv';
        if (!localStorage.getItem('birthday_sheets_url')) {
            localStorage.setItem('birthday_sheets_url', googleSheetsUrl);
        }

        window.onload = function() {
            const savedTheme = localStorage.getItem('birthday_app_theme');
            if (savedTheme === 'dark') {
                document.documentElement.classList.add('dark');
                document.getElementById('themeIcon').className = 'fa-solid fa-sun text-sm';
            }
            if (googleSheetsUrl) {
                syncFromGoogleSheets(true);
            } else {
                refreshAllViews();
            }

            // Auto-sincronización cada 5 minutos en segundo plano
            setInterval(() => {
                if (googleSheetsUrl) {
                    syncFromGoogleSheets(true);
                }
            }, 5 * 60 * 1000);
        };

        function toggleDarkMode() {
            const html = document.documentElement;
            const icon = document.getElementById('themeIcon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                localStorage.setItem('birthday_app_theme', 'light');
                icon.className = 'fa-solid fa-moon text-sm';
            } else {
                html.classList.add('dark');
                localStorage.setItem('birthday_app_theme', 'dark');
                icon.className = 'fa-solid fa-sun text-sm';
            }
        }

        function saveData() {
            localStorage.setItem('birthday_app_data', JSON.stringify(birthdays));
        }

        function parseSheetDate(rawDate) {
            if (!rawDate) return null;
            let clean = rawDate.replace(/^"|"$/g, '').trim();
            
            if (/^\d{4}-\d{2}-\d{2}$/.test(clean)) {
                return clean;
            }

            let parts = clean.split('/');
            if (parts.length === 3) {
                let day = parts[0].padStart(2, '0');
                let month = parts[1].padStart(2, '0');
                let year = parts[2];
                if (year.length === 2) year = '20' + year;
                return `${year}-${month}-${day}`;
            }

            if (parts.length === 2) {
                let day = parts[0].padStart(2, '0');
                let month = parts[1].padStart(2, '0');
                return `2000-${month}-${day}`;
            }

            let d = new Date(clean);
            if (!isNaN(d.getTime())) {
                let y = d.getFullYear();
                if (y < 1920) y = 2000;
                let m = String(d.getMonth() + 1).padStart(2, '0');
                let day = String(d.getDate()).padStart(2, '0');
                return `${y}-${m}-${day}`;
            }

            return null;
        }

        async function syncFromGoogleSheets(isSilent = false) {
            if (!googleSheetsUrl) return;

            const syncBtn = document.getElementById('syncDirectBtn');
            if (syncBtn && !isSilent) {
                syncBtn.innerHTML = '<i class="fa-solid fa-rotate fa-spin"></i><span>Actualizando...</span>';
            }

            try {
                const separator = googleSheetsUrl.includes('?') ? '&' : '?';
                const cacheBustedUrl = `${googleSheetsUrl}${separator}_cb=${new Date().getTime()}`;

                const response = await fetch(cacheBustedUrl);
                if (!response.ok) throw new Error('Network response was not ok');
                const text = await response.text();
                
                const lines = text.split(/\r\n|\n/);
                let newBirthdays = [];

                for (let i = 1; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (!line) continue;

                    const row = [];
                    let inQuotes = false;
                    let currentVal = '';
                    for (let char of line) {
                        if (char === '"') {
                            inQuotes = !inQuotes;
                        } else if (char === ',' && !inQuotes) {
                            row.push(currentVal.trim());
                            currentVal = '';
                        } else {
                            currentVal += char;
                        }
                    }
                    row.push(currentVal.trim());

                    if (row.length >= 2) {
                        let name = '';
                        let rawDate = '';
                        let category = 'otro';
                        let notes = '';
                        let photo = '';

                        // Columnas según tu hoja: [0] nombre, [1] fecha, [2] categoria, [3] notas, [4] foto
                        name = row[0] ? row[0].replace(/^"|"$/g, '') : '';
                        rawDate = row[1] ? row[1].replace(/^"|"$/g, '') : '';
                        category = row[2] ? row[2].replace(/^"|"$/g, '') : 'otro';
                        notes = row[3] ? row[3].replace(/^"|"$/g, '') : '';
                        photo = row[4] ? row[4].replace(/^"|"$/g, '') : '';

                        // Validación por si la fecha está en la primer columna
                        if (!rawDate && row[0] && (row[0].includes('/') || row[0].includes('-'))) {
                            rawDate = row[0];
                            name = row[1] ? row[1].replace(/^"|"$/g, '') : 'Sin nombre';
                            category = row[2] ? row[2].replace(/^"|"$/g, '') : 'otro';
                            notes = row[3] ? row[3].replace(/^"|"$/g, '') : '';
                            photo = row[4] ? row[4].replace(/^"|"$/g, '') : '';
                        }

                        const parsedDate = parseSheetDate(rawDate);
                        if (name && parsedDate) {
                            newBirthdays.push({
                                name: name,
                                date: parsedDate,
                                category: category || 'otro',
                                notes: notes,
                                photo: photo
                            });
                        }
                    }
                }

                if (newBirthdays.length > 0) {
                    birthdays = newBirthdays;
                    saveData();
                    refreshAllViews();
                    if (!isSilent) {
                        showCustomModal('¡Sincronización Exitosa!', `Se han actualizado ${newBirthdays.length} registros desde la hoja web.`);
                    }
                } else {
                    if (!isSilent) showCustomModal('Aviso', 'No se encontraron registros válidos en la hoja publicada.');
                }
            } catch (err) {
                if (!isSilent) {
                    showCustomModal('Error de Conexión', 'No se pudo actualizar desde la web. Comprueba tu enlace o conexión.');
                }
            } finally {
                if (syncBtn && !isSilent) {
                    syncBtn.innerHTML = '<i class="fa-solid fa-rotate"></i><span>Actualizar desde Web</span>';
                }
            }
        }

        function getNextBirthdayDetails(dateString) {
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            const [year, month, day] = dateString.split('-').map(Number);
            
            let nextBday = new Date(today.getFullYear(), month - 1, day);
            nextBday.setHours(0, 0, 0, 0);

            let turnsAge = today.getFullYear() - year;
            let hasRealYear = year > 2005;

            if (nextBday < today) {
                nextBday.setFullYear(today.getFullYear() + 1);
                turnsAge++;
            }

            const diffTime = nextBday - today;
            const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));

            return { diffDays, turnsAge, hasRealYear };
        }

        function refreshAllViews() {
            renderFeaturedTopBanner();
            checkTodayBirthdays();
            renderBirthdays();
            updateStats();
        }

        function renderFeaturedTopBanner() {
            const container = document.getElementById('topFeaturedBirthdayContainer');
            if (!birthdays || birthdays.length === 0) {
                container.innerHTML = '';
                return;
            }

            let processed = birthdays.map((b) => {
                const details = getNextBirthdayDetails(b.date);
                return { ...b, ...details };
            });

            processed.sort((a, b) => a.diffDays - b.diffDays);
            
            let topCardsData = [];
            if (processed.length > 0) {
                const minDays = processed[0].diffDays;
                topCardsData = processed.filter(b => b.diffDays === minDays);
            }

            let html = '';
            topCardsData.forEach((nextBday, index) => {
                let timeBadge = '';
                let subtitleText = '';
                let ageText = nextBday.hasRealYear ? `Cumplirá <strong class="underline">${nextBday.turnsAge} años</strong>` : `Es su cumpleaños`;

                if (nextBday.diffDays === 0) {
                    timeBadge = '<span class="bg-white/25 text-white px-3 py-1 rounded-full text-xs font-bold animate-pulse">¡Es HOY! 🎉</span>';
                    subtitleText = nextBday.hasRealYear ? `¡Está celebrando su cumpleaños hoy y cumple <strong class="underline">${nextBday.turnsAge} años</strong>!` : `¡Está celebrando su cumpleaños hoy!`;
                } else if (nextBday.diffDays === 1) {
                    timeBadge = '<span class="bg-white/25 text-white px-3 py-1 rounded-full text-xs font-bold">Es MAÑANA ⏰</span>';
                    subtitleText = `Falta exactamente 1 día para su cumpleaños. ${ageText}.`;
                } else {
                    timeBadge = `<span class="bg-white/25 text-white px-3 py-1 rounded-full text-xs font-bold">Faltan ${nextBday.diffDays} días ⏳</span>`;
                    subtitleText = `${ageText} en ${nextBday.diffDays} días.`;
                }

                const gradients = [
                    'from-violet-600 via-pink-600 to-rose-500',
                    'from-blue-600 via-indigo-600 to-purple-600',
                    'from-emerald-600 via-teal-600 to-cyan-600',
                    'from-amber-600 via-orange-600 to-rose-600'
                ];
                const gradientClass = gradients[index % gradients.length];

                let avatarContent = '';
                if (nextBday.photo && nextBday.photo.startsWith('http')) {
                    avatarContent = `<img src="${nextBday.photo}" alt="${nextBday.name}" class="w-full h-full object-cover" onerror="this.onerror=null; this.parentElement.innerHTML='${nextBday.name.charAt(0).toUpperCase()}';">`;
                } else {
                    avatarContent = nextBday.name.charAt(0).toUpperCase();
                }

                html += `
                    <div class="bg-gradient-to-r ${gradientClass} text-white p-6 rounded-3xl shadow-xl flex flex-col sm:flex-row items-center justify-between gap-4 relative overflow-hidden animate-fade-in animate-glow">
                        <div class="absolute -right-6 -bottom-6 opacity-10 text-9xl pointer-events-none">
                            <i class="fa-solid fa-cake-candles"></i>
                        </div>
                        <div class="flex items-center space-x-4 z-10">
                            <div class="w-16 h-16 rounded-2xl bg-white/25 backdrop-blur-md flex items-center justify-center text-2xl font-extrabold shadow-inner shrink-0 overflow-hidden transform hover:scale-105 transition-transform">
                                ${avatarContent}
                            </div>
                            <div>
                                <div class="flex items-center space-x-2 mb-1">
                                    <span class="text-xs uppercase tracking-wider font-semibold opacity-90">Próximo Cumpleaños</span>
                                    ${timeBadge}
                                </div>
                                <h2 class="text-2xl font-black tracking-tight">${nextBday.name}</h2>
                                <p class="text-sm opacity-95 mt-0.5">${subtitleText}</p>
                            </div>
                        </div>
                        <div class="z-10 flex sm:flex-col items-center sm:items-end justify-between w-full sm:w-auto pt-3 sm:pt-0 border-t sm:border-t-0 border-white/20 gap-1">
                            <span class="text-xs opacity-80 uppercase tracking-widest font-medium">Categoría</span>
                            <span class="bg-white/20 px-3 py-1 rounded-xl text-xs font-semibold">${nextBday.category}</span>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function checkTodayBirthdays() {
            const todayStr = new Date().toISOString().slice(5, 10);
            const todayBdays = birthdays.filter(b => b.date.slice(5, 10) === todayStr);

            const container = document.getElementById('todayAlertsContainer');
            if (todayBdays.length > 0) {
                let names = todayBdays.map(b => `<strong class="font-semibold">${b.name}</strong>`).join(', ');
                container.innerHTML = `
                    <div class="bg-gradient-to-r from-pink-500 to-rose-500 text-white p-4 rounded-2xl shadow-md flex items-center space-x-3 animate-fade-in">
                        <div class="w-10 h-10 rounded-xl bg-white/20 flex items-center justify-center text-xl shrink-0">
                            <i class="fa-solid fa-cake-candles animate-bounce"></i>
                        </div>
                        <div class="flex-1 text-sm">
                            <span class="font-bold">¡Es cumpleaños hoy!</span> Felicidades a: ${names}. ¡No olvides enviarles un mensaje!
                        </div>
                    </div>
                `;
            } else {
                container.innerHTML = '';
            }
        }

        function updateStats() {
            const currentMonth = new Date().getMonth();
            let thisMonthCount = 0;
            let closest = null;
            let minDays = Infinity;

            birthdays.forEach(b => {
                const [y, m, d] = b.date.split('-').map(Number);
                if (m - 1 === currentMonth) {
                    thisMonthCount++;
                }
                const details = getNextBirthdayDetails(b.date);
                if (details.diffDays < minDays) {
                    minDays = details.diffDays;
                    closest = b.name;
                }
            });

            document.getElementById('statThisMonth').innerText = thisMonthCount;
            document.getElementById('statNext').innerText = closest || '-';
            document.getElementById('statTotal').innerText = birthdays.length;
        }

        function renderBirthdays() {
            const listContainer = document.getElementById('birthdayList');
            const emptyState = document.getElementById('emptyState');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();

            let processed = birthdays.map((b, index) => {
                const details = getNextBirthdayDetails(b.date);
                return { ...b, originalIndex: index, ...details };
            });

            processed.sort((a, b) => a.diffDays - b.diffDays);

            let filtered = processed.filter(b => {
                const matchesSearch = b.name.toLowerCase().includes(searchVal);
                if (!matchesSearch) return false;

                if (currentFilter === 'month') {
                    const currentMonth = new Date().getMonth();
                    const bMonth = parseInt(b.date.split('-')[1]) - 1;
                    return bMonth === currentMonth;
                } else if (currentFilter === 'upcoming') {
                    return b.diffDays <= 30;
                }
                return true;
            });

            if (filtered.length === 0) {
                listContainer.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');

            let html = '';
            filtered.forEach(b => {
                let badgeColor = 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300';
                if (b.category === 'Atencion al usuario') badgeColor = 'bg-rose-50 dark:bg-rose-900/30 text-rose-600 dark:text-rose-400';
                if (b.category === 'Minsal') badgeColor = 'bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400';
                if (b.category === 'Doctor/a') badgeColor = 'bg-emerald-50 dark:bg-emerald-900/30 text-emerald-600 dark:text-emerald-400';
                if (b.category === 'otro') badgeColor = 'bg-amber-50 dark:bg-amber-900/30 text-amber-600 dark:text-amber-400';

                let timeText = '';
                if (b.diffDays === 0) {
                    timeText = '<span class="text-pink-600 dark:text-pink-400 font-bold bg-pink-50 dark:bg-pink-900/30 px-2.5 py-1 rounded-lg text-xs">¡Es hoy! 🎉</span>';
                } else if (b.diffDays === 1) {
                    timeText = '<span class="text-amber-600 dark:text-amber-400 font-semibold bg-amber-50 dark:bg-amber-900/30 px-2.5 py-1 rounded-lg text-xs">Es mañana ⏰</span>';
                } else {
                    timeText = `<span class="text-slate-500 dark:text-slate-400 bg-slate-100 dark:bg-slate-700 px-2.5 py-1 rounded-lg text-xs font-medium">Faltan ${b.diffDays} días</span>`;
                }

                const [y, m, d] = b.date.split('-');
                const monthNames = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
                const formattedDate = `${d} de ${monthNames[parseInt(m)-1]}`;
                const ageSubText = b.hasRealYear ? ` (${b.turnsAge} años)` : '';

                let avatarCardContent = '';
                if (b.photo && b.photo.startsWith('http')) {
                    avatarCardContent = `<img src="${b.photo}" alt="${b.name}" class="w-full h-full object-cover" onerror="this.onerror=null; this.parentElement.innerHTML='${b.name.charAt(0).toUpperCase()}';">`;
                } else {
                    avatarCardContent = b.name.charAt(0).toUpperCase();
                }

                html += `
                    <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200/80 dark:border-slate-700 shadow-sm flex flex-col justify-between hover:shadow-md transition-all duration-300 transform hover:-translate-y-1 relative group animate-fade-in">
                        <div class="flex items-start justify-between">
                            <div class="flex items-center space-x-3">
                                <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-slate-100 to-slate-200 dark:from-slate-700 dark:to-slate-600 text-slate-700 dark:text-slate-200 font-bold flex items-center justify-center text-base shadow-inner overflow-hidden shrink-0">
                                    ${avatarCardContent}
                                </div>
                                <div>
                                    <h4 class="font-bold text-slate-800 dark:text-white text-base">${b.name}</h4>
                                    <p class="text-xs text-slate-400 mt-0.5"><i class="fa-regular fa-calendar mr-1"></i> ${formattedDate}${ageSubText}</p>
                                </div>
                            </div>
                            <div class="flex items-center space-x-1">
                                <button onclick="editBirthday(${b.originalIndex})" class="w-8 h-8 rounded-lg text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700 flex items-center justify-center transition-colors" title="Editar">
                                    <i class="fa-solid fa-pen text-xs"></i>
                                </button>
                                <button onclick="deleteBirthday(${b.originalIndex})" class="w-8 h-8 rounded-lg text-slate-400 hover:text-rose-600 hover:bg-rose-50 dark:hover:bg-rose-900/30 flex items-center justify-center transition-colors" title="Eliminar">
                                    <i class="fa-solid fa-trash text-xs"></i>
                                </button>
                            </div>
                        </div>

                        <div class="mt-4 pt-4 border-t border-slate-100 dark:border-slate-700 flex items-center justify-between">
                            <span class="text-xs font-medium px-2.5 py-1 rounded-lg ${badgeColor}">${b.category}</span>
                            ${timeText}
                        </div>
                        ${b.notes ? `<div class="mt-3 text-xs text-slate-500 dark:text-slate-400 bg-slate-50 dark:bg-slate-900/50 p-2.5 rounded-xl border border-slate-100 dark:border-slate-700"><i class="fa-regular fa-note-sticky mr-1 text-slate-400"></i> ${b.notes}</div>` : ''}
                    </div>
                `;
            });

            listContainer.innerHTML = html;
        }

        function setFilter(type) {
            currentFilter = type;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                if(btn.id !== 'syncDirectBtn') {
                    btn.className = "filter-btn px-3.5 py-1.5 rounded-xl text-xs font-medium bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600 transition-all whitespace-nowrap";
                }
            });
            document.getElementById(`filter-${type}`).className = "filter-btn px-3.5 py-1.5 rounded-xl text-xs font-medium bg-pink-500 text-white transition-all whitespace-nowrap shadow-sm";
            renderBirthdays();
        }

        function openModal() {
            document.getElementById('modalTitle').innerText = 'Nuevo Cumpleaños';
            document.getElementById('birthdayForm').reset();
            document.getElementById('editIndex').value = '';
            
            const modal = document.getElementById('birthdayModal');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                document.getElementById('modalContent').classList.remove('scale-95');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('birthdayModal');
            modal.classList.add('opacity-0');
            document.getElementById('modalContent').classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        function saveBirthday(event) {
            event.preventDefault();
            const index = document.getElementById('editIndex').value;
            const name = document.getElementById('bName').value.trim();
            const date = document.getElementById('bDate').value;
            const category = document.getElementById('bCategory').value;
            const photo = document.getElementById('bPhoto').value.trim();
            const notes = document.getElementById('bNotes').value.trim();

            if (index === '') {
                birthdays.push({ name, date, category, photo, notes });
                showCustomModal('¡Guardado!', 'El cumpleaños se ha registrado correctamente.');
            } else {
                birthdays[index] = { ...birthdays[index], name, date, category, photo, notes };
                showCustomModal('¡Actualizado!', 'Los datos se han modificado con éxito.');
            }

            saveData();
            closeModal();
            refreshAllViews();
        }

        function editBirthday(index) {
            const b = birthdays[index];
            document.getElementById('modalTitle').innerText = 'Editar Cumpleaños';
            document.getElementById('editIndex').value = index;
            document.getElementById('bName').value = b.name;
            document.getElementById('bDate').value = b.date;
            document.getElementById('bCategory').value = b.category || 'otro';
            document.getElementById('bPhoto').value = b.photo || '';
            document.getElementById('bNotes').value = b.notes || '';

            const modal = document.getElementById('birthdayModal');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                document.getElementById('modalContent').classList.remove('scale-95');
            }, 10);
        }

        function deleteBirthday(index) {
            birthdays.splice(index, 1);
            saveData();
            refreshAllViews();
            showCustomModal('Eliminado', 'El registro ha sido borrado de la lista.');
        }

        function showCustomModal(title, text) {
            document.getElementById('customModalTitle').innerText = title;
            document.getElementById('customModalText').innerText = text;
            document.getElementById('customModal').classList.remove('hidden');
        }

        function closeCustomModal() {
            document.getElementById('customModal').classList.add('hidden');
        }

        function filterBirthdays() {
            renderBirthdays();
        }
    </script>
</body>
</html>
